<!DOCTYPE html>
<html lang="en-US" dir="ltr" data-navigation-type="default" data-navbar-horizontal-shape="default">

  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">


    <!-- ===============================================-->
    <!--    Document Title-->
    <!-- ===============================================-->
    <title>Phoenix</title>


    <!-- ===============================================-->
    <!--    Favicons-->
    <!-- ===============================================-->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicons/favicon-16x16.png">
    <link rel="shortcut icon" type="image/x-icon" href="/assets/img/favicons/favicon.ico">
    <link rel="manifest" href="/assets/img/favicons/manifest.json">
    <meta name="msapplication-TileImage" content="/assets/img/favicons/mstile-150x150.png">
    <meta name="theme-color" content="#ffffff">
    <script src="/assets/vendors/simplebar/simplebar.min.js"></script>
    <script src="/assets/js/config.js"></script>


    <!-- ===============================================-->
    <!--    Stylesheets-->
    <!-- ===============================================-->
    <link href="/assets/vendors/dropzone/dropzone.css" rel="stylesheet">
    <link href="/assets/vendors/choices/choices.min.css" rel="stylesheet">
    <link href="/assets/vendors/flatpickr/flatpickr.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link href="/assets/vendors/simplebar/simplebar.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">
    <link href="/assets/css/theme-rtl.min.css" type="text/css" rel="stylesheet" id="style-rtl">
    <link href="/assets/css/theme.min.css" type="text/css" rel="stylesheet" id="style-default">
    <link href="/assets/css/user-rtl.min.css" type="text/css" rel="stylesheet" id="user-style-rtl">
    <link href="/assets/css/user.min.css" type="text/css" rel="stylesheet" id="user-style-default">
    <script>
      var phoenixIsRTL = window.config.config.phoenixIsRTL;
      if (phoenixIsRTL) {
        var linkDefault = document.getElementById('style-default');
        var userLinkDefault = document.getElementById('user-style-default');
        linkDefault.setAttribute('disabled', true);
        userLinkDefault.setAttribute('disabled', true);
        document.querySelector('html').setAttribute('dir', 'rtl');
      } else {
        var linkRTL = document.getElementById('style-rtl');
        var userLinkRTL = document.getElementById('user-style-rtl');
        linkRTL.setAttribute('disabled', true);
        userLinkRTL.setAttribute('disabled', true);
      }
    </script>
  </head>


  <body>

    <!-- ===============================================-->
    <!--    Main Content-->
    <!-- ===============================================-->
    <main class="main" id="top">
      
      <nav class="navbar navbar-vertical navbar-expand-lg">
        <div class="collapse navbar-collapse" id="navbarVerticalCollapse">
</div>
      </nav>
      <nav class="navbar navbar-top fixed-top navbar-expand" id="navbarDefault">
        <div class="collapse navbar-collapse justify-content-between">
        </div>
      </nav>

    <div class="content d-flex justify-content-center align-items-center" style="min-height: 100vh;">
  <form class="w-100" style="max-width: 900px;">
    <div class="row g-3 text-center mb-5">
      <div class="col-12">
        <h2 class="mb-2">Plantilla de Mision y Vision</h2>
        <h5 class="text-body-tertiary fw-semibold">Consulta y Mantenimiento de plantillas de Mision y Vision</h5>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h4 class="card-title mb-4 d-flex align-items-center justify-content-center gap-2">
          <img src="/assets/img/logouta.png" alt="phoenix" width="37" />
          <span>Mision y Vision</span>

          <button *ngIf="!editpersona" (click)="editarPersona()" class="btn btn-link p-0" type="button">
            <span class="fa-solid fa-edit me-sm-2"></span>
            <span class="d-none d-sm-inline">Edit</span>
          </button>

          <button *ngIf="editpersona" (click)="cancelPersona()" class="btn btn-link p-0" type="button">
            <span class="fa-solid fa-cancel me-sm-2"></span>
            <span class="d-none d-sm-inline">Cancel</span>
          </button>
        </h4>

        <div *ngFor="let misionpP of misionp">
          <div class="mb-4 text-start">
            <h5 class="mb-2 text-body-highlight">MISION</h5>
            <textarea #creacionm id="creacionm" class="form-control">{{misionpP.MISION}}</textarea>
          </div>

          <div class="mb-4 text-start">
            <h5 class="mb-2 text-body-highlight">VISION</h5>
            <textarea #asignacionm id="asignacionm" class="form-control">{{misionpP.VISION}}</textarea>
          </div>

          <div class="d-flex justify-content-center">
            <div *ngIf="editpersona">
              <button (click)="modificarregistro(creacionm.value, asignacionm.value)" class="btn btn-success" type="button">
                <span class="fas fa-save me-2"></span> Guardar Cambios
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </form>
</div>

    </main>


  </body>

</html>
